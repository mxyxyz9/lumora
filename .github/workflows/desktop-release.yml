name: Lumora Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macOS
            dist_cmd: npm run dist:mac
          - os: windows-latest
            target: Windows
            dist_cmd: npm run dist:win
          - os: ubuntu-latest
            target: Linux
            dist_cmd: npm run dist:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 rpm graphicsmagick icnsutils

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Renderer & Electron Main TypeScript
        working-directory: desktop
        run: |
          npm run build
          npm run build:electron

      - name: Package with Electron Builder (${{ matrix.target }})
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.dist_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumora-${{ matrix.target }}-artifacts
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.zip
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.0.2' }}
          name: Lumora Desktop ${{ github.ref_name || inputs.version || 'v1.0.2' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-binaries/*.dmg
            release-binaries/*.exe
            release-binaries/*.AppImage
            release-binaries/*.deb
            release-binaries/*.rpm
            release-binaries/*.tar.gz
            release-binaries/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
