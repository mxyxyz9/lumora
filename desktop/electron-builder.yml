appId: fi.wekan.lumora
productName: Lumora
copyright: "Copyright © 2026 Lauri Ojansivu / WeKan / Lumora"

directories:
  output: release
  buildResources: build

publish:
  provider: github
  owner: mxyxyz9
  repo: lumora

files:
  - dist/**/*
  - dist-electron/**/*
  - build/**/*
  - package.json

extraMetadata:
  main: dist-electron/main/main.js

# macOS Configuration
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: "${productName}-${version}-Mac-${arch}.${ext}"

dmg:
  title: "${productName} ${version} Installer"
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

# Windows Configuration
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-${version}-Windows-${arch}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Lumora Kanban"

# Linux Configuration
linux:
  category: Office;Development;Utility;ProjectManagement;
  icon: build/icon.png
  desktop:
    Name: Lumora
    Comment: Minimalist, AI-Powered Kanban Workspace & Autonomous Dev Pipeline
    GenericName: Kanban Workspace
    Categories: Office;Development;ProjectManagement;
    StartupWMClass: Lumora
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: "${productName}-${version}-Linux-${arch}.${ext}"

deb:
  priority: optional
  packageCategory: utils
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1 | libayatana-appindicator3-1
    - libxtst6
    - libnss3
    - libasound2

rpm:
  category: Development/Tools
